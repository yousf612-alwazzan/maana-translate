<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- The address of this page carries a one-time code for the extension. Nothing
     here loads from another site, and no address is passed on to any link. -->
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>معنى — ربط OpenRouter</title>
<link rel="icon" href="img/icon.png">
<style>
  :root { color-scheme: dark; --bg: #17161b; --panel: #201f25; --line: #34323b; --light: #efe9dc; --dim: #b9b3a6; --red: #e23a2b; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--light);
    font: 500 17px/1.8 "Segoe UI", Tahoma, sans-serif; padding: 24px; }
  main { max-width: 560px; width: 100%; background: var(--panel); border: 1px solid var(--line); border-inline-start: 3px solid var(--red); padding: 26px 28px; }
  h1 { margin: 0 0 6px; font-size: 22px; }
  p { margin: 0; color: var(--dim); }
  .later { margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--line); opacity: 0; animation: show .3s ease 6s forwards; }
  .later ol { margin: 8px 0 0; padding-inline-start: 22px; color: var(--dim); }
  @keyframes show { to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .later { animation: none; opacity: 1; } }
</style>
</head>
<body>
  <main>
    <h1>أكمل ربط حسابك</h1>
    <p>الإضافة تاخذ المفتاح من OpenRouter الحين وترجعك لصفحة إعداداتها خلال ثواني.</p>
    <div class="later">
      <p>إذا بقيت هالصفحة مكانها:</p>
      <ol>
        <li>تأكد إن إضافة «معنى» مثبتة ومشغّلة في المتصفح.</li>
        <li>افتح إعدادات الإضافة واضغط «اربط حساب OpenRouter» مرة ثانية.</li>
      </ol>
    </div>
  </main>
</body>
</html>
